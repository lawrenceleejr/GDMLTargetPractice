# The neutrino slice simulated ENTIRELY in Geant4, with cross-section biasing
# so an interaction is guaranteed in every event.
#
# Geant4's built-in neutrino processes have physical cross sections so tiny
# that an unbiased run through even a kt detector records essentially nothing.
# This config drives the geant4 backend with a single biasing factor of 1e10,
# so the neutrino interacts inside MAIA and you see the shower -- one engine,
# one stage (the generator backends reach the same place in two: their
# interaction, then the same Geant4 transport).
#
#   gdmltp run --config examples/maia/nu_slice_geant4_biased.yaml -o slice_g4
#   gdmltp analyze slice_g4/output.root      # depth-dose, secondaries, CC/NC
#   gdmltp display slice_g4/output.root --gdml gdml/MAIA_v0.gdml --events 0:10
#
# THIS IS THE ONE EXAMPLE THAT DELIBERATELY LETS GEANT4 DO THE NEUTRINO
# INTERACTION, so running it prints the "neutrino beam on the bare Geant4
# backend" banner -- that warning is correct and expected here, and
# GDMLTP_NO_WARNINGS=1 silences it. Geant4's neutrino model is thin: the 1e10
# bias enhances the interaction RATE and the per-event kinematics are Geant4's,
# not an event generator's. Use it for energy deposition / detector response and
# as the contrast run; use the genie/achilles/pythia slice configs (which end in
# Geant4 anyway, via the HepMC3 hand-off) for interaction physics.
generator: geant4

geometry:
  gdml: gdml/MAIA_v0.gdml

beam:
  particle: nu_mu
  # The muon-collider neutrino-slice spectrum (mu- beam, E_mu = 5 TeV), sampled
  # host-side into a beam file and replayed through Geant4.
  energy: {mode: mudecay_numu, value: "5 TeV"}
  # The slice launched from far upstream in z (~25 m back), a multi-meter-wide
  # ribbon in x across the negative-x half, very thin in y, flying downstream
  # (+z). Geant4 transports each neutrino from the source plane and the 1e10
  # bias forces it to interact -- so the showers appear across MAIA. (With a
  # bias this large some neutrinos may interact in the upstream air before
  # reaching the detector; shorten z to sit just upstream of the body if you
  # want every interaction inside MAIA.)
  position:
    x: {dist: uniform, min: "-600 cm", max: "0 cm"}    # multi-meter x spread
    y: {dist: gauss, sigma: "5 mm"}                     # very small y spread
    z: "-2500 cm"                                        # far upstream (~25 m)
  direction:
    central: "0 0 1"                                     # downstream, into MAIA
    xprime: {dist: gauss, sigma: "10 mrad"}
    yprime: {dist: gauss, sigma: "0.1 mrad"}

geant4:
  neutrino_bias:
    factor: 1.0e10 # This is the default value for ALL neutrino interactions
    # If you want to investigate a specific interaction, set this to 1 and then
    # set your specific channel to whatever biasing you'd like


    # Biasings for indivudal processes are provided below
    TAUNUNUCBIASCC: 1e11
    TAUNUNUCBIASNC: 1
    TAUANUNUCBIASCC: 1
    TAUANUNUCBIASNC: 1
    MUNUNUCBIASCC: 1e11
    MUNUNUCBIASNC: 1
    MUANUNUCBIASCC: 1e1
    MUANUNUCBIASNC: 1
    ELNUNUCBIASCC: 1e11
    ELNUNUCBIASNC: 1
    ELANUNUCBIASCC: 1
    ELANUNUCBIASNC: 1
    NUELECCCBIAS: 1
    NUELECNCBIAS: 1

run:
  events: 200
  output: output.root
  seed: 20241417
