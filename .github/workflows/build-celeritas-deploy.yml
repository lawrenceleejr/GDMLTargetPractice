name: Build Celeritas Image
on:
  push:
  workflow_dispatch:

jobs:
  docker-celeritas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-celeritas
            type=sha,prefix={{branch}}-,suffix=-celeritas
            type=raw,value=latest-celeritas,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/geant4-celeritas.Dockerfile
          load: true
          push: false
          tags: gdmltp-celeritas:test
          cache-from: type=gha,scope=celeritas
          cache-to: type=gha,mode=max,scope=celeritas

      - name: Smoke test image (offload enabled and disabled)
        run: |
          docker run --rm -v "$PWD":/work -w /work gdmltp-celeritas:test g4sim/run_ci.mac
          rm -f output.root
          docker run --rm -e CELER_DISABLE=1 -v "$PWD":/work -w /work gdmltp-celeritas:test g4sim/run_ci.mac
          rm -f output.root

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/geant4-celeritas.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=celeritas
          cache-to: type=gha,mode=max,scope=celeritas
