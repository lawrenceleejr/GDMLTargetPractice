name: Build, Test, Deploy
on:
  push:
  pull_request:

jobs:
  # ---- Unit tests: pure Python, no ROOT/Geant4/Docker (gating) ------------- #
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 floor: writing jagged-string branches with uproot (the test
        # fixtures and the GENIE/Achilles converters do) needs uproot/awkward
        # releases that no longer support 3.9.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gdmltp
        run: pip install -e .[dev]

      - name: Run unit test suite
        run: pytest tests/ -v

      - name: Deprecated g4tp alias still imports
        run: python -c "import warnings; warnings.simplefilter('ignore'); import g4tp; from g4tp import cli, io; from g4tp.backends import genie_convert; print('g4tp shim OK', g4tp.__version__)"

  # ---- Geant4 build + end-to-end integration (gating) --------------------- #
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lawrenceleejr/root-geant4-garfield:cpp17_root-v6-26-10_geant4-v11.4.1_garfield-e0a9f171
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HepMC3 (generator->Geant4 hand-off interchange)
        run: |
          HEPMC3_VERSION=3.3.0
          wget -q --tries=5 --retry-connrefused --waitretry=20 --timeout=30 \
            --retry-on-http-error=429,500,502,503,504 \
            https://gitlab.cern.ch/hepmc/HepMC3/-/archive/${HEPMC3_VERSION}/HepMC3-${HEPMC3_VERSION}.tar.gz
          tar xzf HepMC3-${HEPMC3_VERSION}.tar.gz
          cmake -S HepMC3-${HEPMC3_VERSION} -B hepmc3-build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DHEPMC3_ENABLE_PYTHON=OFF -DHEPMC3_ENABLE_ROOTIO=OFF \
            -DHEPMC3_ENABLE_TEST=OFF -DHEPMC3_BUILD_EXAMPLES=OFF
          cmake --build hepmc3-build --target install -j"$(nproc)"
          ldconfig

      - name: Configure & build g4sim
        run: |
          mkdir -p build && cd build
          cmake ../g4sim/
          cmake --build .

      - name: Install gdmltp in the container
        # The container's stock pip predates PEP 621 pyproject metadata; upgrade
        # the toolchain first so the install is real (deps included), not a
        # silent UNKNOWN-0.0.0.
        run: |
          python3 -m pip install --no-cache-dir --upgrade pip setuptools wheel
          python3 -m pip install --no-cache-dir -e .
          python3 -c "import gdmltp, numpy, uproot; print('gdmltp', gdmltp.__version__)"

      - name: Run CI macro (direct g4sim)
        run: |
          ldconfig
          ./build/g4sim g4sim/run_ci.mac
          #test -f output.root && rm -f output.root
          ls -la *.root
          rm -f output.root

      - name: Run an arb-mode macro (beta spectrum into the Si tracker)
        run: |
          ./build/g4sim macros/betas_silicon_sr90.mac
          test -f output.root && rm -f output.root

      - name: Beam-file replay (/gun/beamFile) smoke
        run: |
          cat > beam.dat << 'EOF'
          # <name|pdg>  x y z [mm]  px py pz [MeV/c]
          e- 0 0 -50 0 0 500
          11 1 0 -50 0 0 500
          2212 -1 0 -50 0 0 500
          EOF
          cat > beam.mac << 'EOF'
          /detector/readGDML gdml/silicon_slab_1mm.gdml
          /run/initialize
          /gun/beamFile beam.dat
          /run/beamOn 3
          EOF
          ./build/g4sim beam.mac
          test -f output.root
          python3 -c "import uproot,sys; n=uproot.open('output.root')['tree'].num_entries; print('events',n); sys.exit(0 if n==3 else 1)"
          rm -f output.root beam.dat beam.mac

      - name: Hand-off HepMC3 smoke (/gun/hepmcFile)
        run: |
          # Write the hand-off with the official library (pyhepmc), then g4sim
          # reads it back with HepMC3::ReaderAscii -- the real interchange, both
          # ends. Second event carries a vertex time that must reach step times.
          python3 - << 'PY'
          import pyhepmc
          C = 299.792458  # mm/ns
          # event 1 carries a final-state NEUTRINO on purpose: a hand-off replay
          # must transport it silently -- the "bare Geant4 neutrino" banner is
          # about a GUN-fired neutrino beam, not a generator's final state.
          specs = [([(13,0,0,900),(2212,50,0,300)], (0,0,-20), 0.0),
                   ([(13,0,0,700),(211,-30,0,200),(2112,0,20,150),(14,0,0,120)],
                    (1,0,-20), 166.8)]
          # A THIRD event with TWO vertices far apart: an exit/scoring-plane file
          # has one crossing point per particle, so the reader must fire each
          # primary from ITS OWN vertex. With the old one-vertex-per-event
          # reading, both of these would start at -300 mm.
          split = [((13, 0, 0, 900), (0, 0, -300), 0.0),
                   ((13, 0, 0, 900), (0, 0,  300), 0.0)]
          with pyhepmc.open("events.hepmc", "w") as w:
              for i,(parts,v,tns) in enumerate(specs):
                  ev = pyhepmc.GenEvent(pyhepmc.Units.MEV, pyhepmc.Units.MM)
                  ev.event_number = i
                  vtx = pyhepmc.GenVertex((v[0],v[1],v[2], tns*C))
                  vtx.add_particle_in(pyhepmc.GenParticle((0,0,1000,1000), 14, 4))
                  for pid,px,py,pz in parts:
                      import math
                      vtx.add_particle_out(pyhepmc.GenParticle(
                          (px,py,pz, math.sqrt(px*px+py*py+pz*pz)+140.0), pid, 1))
                  ev.add_vertex(vtx)
                  w.write(ev)

              ev = pyhepmc.GenEvent(pyhepmc.Units.MEV, pyhepmc.Units.MM)
              ev.event_number = len(specs)
              for (pid, px, py, pz), v, tns in split:
                  import math
                  vtx = pyhepmc.GenVertex((v[0], v[1], v[2], tns * C))
                  vtx.add_particle_in(pyhepmc.GenParticle((0,0,1000,1000), 14, 4))
                  vtx.add_particle_out(pyhepmc.GenParticle(
                      (px, py, pz, math.sqrt(px*px+py*py+pz*pz) + 140.0), pid, 1))
                  ev.add_vertex(vtx)
              w.write(ev)
          print("wrote events.hepmc")
          PY
          cat > transport.mac << 'EOF'
          /detector/readGDML gdml/liquid_argon_1m3.gdml
          /run/initialize
          /analysis/neutrinoMode off
          /gun/hepmcFile events.hepmc
          /run/beamOn 3
          EOF
          ./build/g4sim transport.mac > handoff.log 2>&1 || { cat handoff.log; exit 1; }
          cat handoff.log
          test -f output.root
          # a generator's final-state neutrino is not a neutrino BEAM: no banner
          if grep -q "ON THE BARE GEANT4 BACKEND" handoff.log; then
            echo "the hand-off replay wrongly warned about a neutrino beam" >&2
            exit 1
          fi
          python3 - << 'PY'
          import uproot, awkward as ak
          t = uproot.open('output.root')['tree']
          assert t.num_entries == 3, f"events {t.num_entries}"
          st = t['step_time'].array()
          t0 = ak.min(st[1]) if len(st[1]) else 0.0
          print('event 1 earliest step time:', t0)
          assert t0 >= 166.8, "HepMC vertex time was not applied to the primaries"
          # event 2: two primaries, each from its OWN production vertex
          parent = t['trk_parentID'].array()[2]
          startZ = t['trk_startZ'].array()[2]
          zs = sorted({round(float(z)) for z, p in zip(startZ, parent) if p == 0})
          print('event 2 primary start z:', zs)
          assert zs == [-300, 300], (
              f"per-particle vertices lost: primaries started at {zs}, "
              f"expected [-300, 300]")
          PY
          rm -f output.root events.hepmc transport.mac handoff.log

      - name: BSM decay smoke (/bsm/define -> G4Decay)
        # Geant4 does the decay: define a 1 GeV neutral with a short sampled
        # ctau, fire it into the LAr cube, and require in-flight decays with
        # "Decay"-created daughters in the output.
        run: |
          cat > bsm.mac << 'EOF'
          /bsm/define N1 9900014 1000.0 0 50.0
          /bsm/channel 0.6 13 211
          /bsm/channel 0.4 14 13 -13
          /detector/readGDML gdml/liquid_argon_1m3.gdml
          /run/initialize
          /analysis/neutrinoMode off
          /random/setSeeds 41 42
          /gun/particlePDG 9900014
          /gun/energy 10 GeV
          /gun/position 0 0 -60 cm
          /gun/direction 0 0 1
          /run/beamOn 20
          EOF
          ./build/g4sim bsm.mac
          test -f output.root
          python3 - << 'PY'
          import uproot, awkward as ak
          t = uproot.open('output.root')['tree']
          assert t.num_entries == 20
          pdg = t['primaryPDG'].array(library='np')
          assert (pdg == 9900014).all(), pdg[:5]
          proc = t['trk_creatorProcess'].array()
          parent = t['trk_parentID'].array()
          decayed = ak.sum(ak.any((parent == 1) & (proc == 'Decay'), axis=1))
          print('events with an in-flight decay:', decayed, '/ 20')
          assert decayed > 0, "no G4Decay daughters found"
          PY
          rm -f output.root bsm.mac

      - name: Neutrino-bias smoke (/gdmltp/neutrinoBias -> G4EmParameters)
        # The bias command must be registered and drive the neutrino cross
        # sections via the C++ API -- it must NOT abort the batch the way the
        # optional /physics_lists/em/Nu* UI commands do in this Geant4 build.
        run: |
          cat > nubias.mac << 'EOF'
          /detector/readGDML gdml/liquid_argon_1m3.gdml
          /run/initialize
          /custom/biasing/MuNuNucleusCcBias 1e10
          /custom/biasing/MuNuNucleusNcBias 1e10
          /analysis/neutrinoMode on
          /random/setSeeds 7 8
          /gun/particle nu_mu
          /gun/energy 5 GeV
          /gun/position 0 0 -60 cm
          /gun/direction 0 0 1
          /run/beamOn 20
          EOF
          ./build/g4sim nubias.mac > nubias.log 2>&1 || { cat nubias.log; exit 1; }
          cat nubias.log
          test -f output.root
          # firing a neutrino AT Geant4 is generator-free neutrino physics: the
          # engine must say so loudly, and point at the generators
          grep -q "ON THE BARE GEANT4 BACKEND" nubias.log
          grep -q "USE A NEUTRINO EVENT GENERATOR INSTEAD" nubias.log
          test "$(grep -c 'ON THE BARE GEANT4 BACKEND' nubias.log)" = "1"   # once per run
          # ... and it must be mutable for scripted/large runs
          GDMLTP_NO_WARNINGS=1 ./build/g4sim nubias.mac > nubias_quiet.log 2>&1 \
            || { cat nubias_quiet.log; exit 1; }
          if grep -q "ON THE BARE GEANT4 BACKEND" nubias_quiet.log; then
            echo "GDMLTP_NO_WARNINGS did not silence the engine banner" >&2
            exit 1
          fi
          python3 -c "import uproot,sys; t=uproot.open('output.root')['tree']; n=t.num_entries; nu='nu_isCC' in [k.split(';')[0] for k in t.keys()]; print('events',n,'nu block',nu); sys.exit(0 if (n==20 and nu) else 1)"
          rm -f output.root nubias.mac nubias.log nubias_quiet.log

      - name: Particle-by-PDG smoke (/gun/particlePDG)
        run: |
          cat > pdg.mac << 'EOF'
          /detector/readGDML gdml/silicon_slab_1mm.gdml
          /run/initialize
          /gun/particlePDG 2212
          /gun/energy 200 MeV
          /gun/position 0 0 -50 mm
          /gun/direction 0 0 1
          /run/beamOn 2
          EOF
          ./build/g4sim pdg.mac
          test -f output.root
          python3 -c "import uproot,sys; t=uproot.open('output.root')['tree']; import numpy as np; pdg=t['primaryPDG'].array(library='np'); print('primaries',pdg.tolist()); sys.exit(0 if (t.num_entries==2 and (pdg==2212).all()) else 1)"
          rm -f output.root pdg.mac

      - name: Exit HepMC3 export + replay (the staged-simulation round trip)
        # g4sim reads HepMC3 already; this proves it now WRITES it too, and that
        # what it writes is replayable -- stage 1 records what leaves, stage 2
        # fires those particles as its primaries.
        #
        # Geometry chosen so the answer cannot be zero by luck: a 500 MeV
        # electron crosses OUT of a 1 mm silicon slab and then out of the world,
        # so both surfaces are guaranteed to be hit. (A proton stopping inside a
        # thick phantom escapes almost nothing -- a fine physics result, a
        # useless test.)
        run: |
          write_mac() {   # $1 = macro, $2 = exit file, $3 = volume, $4 = min KE
          cat > "$1" << EOF
          /detector/readGDML gdml/silicon_slab_1mm.gdml
          /run/initialize
          /analysis/neutrinoMode off
          /analysis/exitHepMC $2
          /analysis/exitVolume $3
          /analysis/exitMinKE $4
          /random/setSeeds 21 22
          /gun/particle e-
          /gun/energy 500 MeV
          /gun/position 0 0 -49 mm
          /gun/direction 0 0 1
          /run/beamOn 3
          EOF
          }
          # (a) the world surface: everything escaping the simulation, KE cut on
          write_mac world.mac world.hepmc World "1 MeV"
          ./build/g4sim world.mac > world.log 2>&1 || { cat world.log; exit 1; }
          grep "Exit HepMC3" world.log
          # (b) the slab surface, by its GDML (logical) name, no cut
          write_mac slab.mac slab.hepmc SiSlab_vol "0 MeV"
          ./build/g4sim slab.mac > slab.log 2>&1 || { cat slab.log; exit 1; }
          grep "Exit HepMC3" slab.log

          python3 - << 'PY'
          import pyhepmc

          def read(path):
              events, parts = 0, []
              with pyhepmc.open(path) as f:
                  for ev in f:
                      events += 1
                      assert "SiSlab_vol" in str(ev.attributes["gdmltp_exit_volume"]) \
                          or "World" in str(ev.attributes["gdmltp_exit_volume"])
                      assert "gdmltp_primary_pdg" in ev.attributes
                      for p in ev.particles:
                          if p.status == 4:
                              continue            # the incoming primary leg
                          assert p.status == 1, f"status {p.status}"
                          v = p.production_vertex
                          assert v is not None, "no crossing vertex"
                          parts.append((p.pid, p.momentum.e - p.generated_mass,
                                        v.position.z, v.position.t))
              return events, parts

          w_events, w = read("world.hepmc")
          s_events, sl = read("slab.hepmc")
          print(f"world surface: {w_events} events, {len(w)} crossings")
          print(f"slab surface : {s_events} events, {len(sl)} crossings")
          assert w_events == 3 and s_events == 3
          assert w and sl, "a 500 MeV electron must cross both surfaces"

          # the KE cut is applied (world run asked for >= 1 MeV)
          assert all(ke >= 1.0 - 1e-6 for _, ke, _, _ in w), min(k for _, k, _, _ in w)

          # the two surfaces are genuinely different places: the slab spans
          # |z| <= 0.5 mm, the world face sits at |z| = 50 mm
          assert any(abs(z) <= 0.6 for _, _, z, _ in sl), \
              f"slab crossings not on the slab: {sorted({round(z,3) for _,_,z,_ in sl})}"
          assert all(abs(z) < 49.0 for _, _, z, _ in sl), \
              "slab export picked up world-boundary crossings"
          assert any(abs(z) >= 49.0 for _, _, z, _ in w), \
              "world export missed the world boundary"

          # (that the recorded point is the REAL crossing, not something fixed
          # like the primary's start, is what the two surfaces above show; the
          # reader side is pinned deterministically in the hand-off smoke.)
          print("exit export OK: both surfaces, KE cut honoured")
          PY

          # ... and stage 2 replays the file as its primaries
          cat > replay.mac << 'EOF'
          /detector/readGDML gdml/liquid_argon_1m3.gdml
          /run/initialize
          /analysis/neutrinoMode off
          /gun/hepmcFile world.hepmc
          /run/beamOn 3
          EOF
          ./build/g4sim replay.mac > replay.log 2>&1 || { cat replay.log; exit 1; }
          grep -q "loaded 3 HepMC3 hand-off event(s)" replay.log
          python3 - << 'PY'
          import uproot
          t = uproot.open("output.root")["tree"]
          assert t.num_entries == 3, t.num_entries
          n = t["nTracks"].array(library="np")
          print("stage 2 tracks per event:", n.tolist())
          assert n.sum() > 0, "stage 2 transported nothing"
          PY
          rm -f world.hepmc slab.hepmc output.root world.mac slab.mac replay.mac \
                world.log slab.log replay.log

      - name: Python-written ntuples must open in REAL ROOT as a TTree
        # The regression this guards: uproot 5.7 writes an RNTuple for
        # `f["tree"] = data`, which uproot itself reads back fine (so every
        # Python test passes) while `root output.root` reports
        #   Error in <TKey::ReadObj>: Unknown class ROOT::RNTuple
        # This container has ROOT, so the check is the real thing, not a proxy.
        run: |
          python3 - << 'PY'
          import numpy as np, awkward as ak
          from gdmltp import io
          io.write_tree("pywritten.root", {
              "eventID": np.arange(4, dtype=np.int32),
              "primaryE": np.full(4, 150.0),
              "totalEdep": np.linspace(1.0, 4.0, 4),
              "trk_pdg": ak.Array([[11, 22], [2212], [], [13]]),
              # jagged strings: uproot cannot put vector<string> in a TTree, so
              # these become int codes + the gdmltp_strings legend
              "trk_creatorProcess": ak.Array([["Primary", "eBrem"], ["Decay"],
                                              [], ["Primary"]]),
          })
          print("wrote pywritten.root")
          PY
          root -l -b -q '.github/scripts/check_ttree.C("pywritten.root", 4)' \
            > root_check.log 2>&1 || { cat root_check.log; exit 1; }
          cat root_check.log
          if grep -q "Unknown class" root_check.log; then
            echo "ROOT could not read a class in the file (RNTuple?)" >&2
            exit 1
          fi
          grep -q "holds a classic TTree" root_check.log
          # and the round trip our own tools rely on
          python3 -c "
          from gdmltp import io
          import awkward as ak
          assert io.string_legend('pywritten.root')['trk_creatorProcess'] == ['Decay', 'Primary', 'eBrem']
          got = ak.to_list(io.read_string_branch('pywritten.root', 'trk_creatorProcess'))
          assert got == [['Primary', 'eBrem'], ['Decay'], [], ['Primary']], got
          print('legend round-trip OK')"
          rm -f pywritten.root root_check.log

      - name: Integration - YAML config -> macro -> g4sim -> analyze
        # Gating end-to-end check of the whole common frontend against the real
        # engine (gdmltp installed in the container two steps up).
        run: |
          export PATH="$PWD/build:$PATH"
          python3 -m gdmltp run --config examples/water_proton.yaml --local -n 5 -o run_out
          test -f run_out/output.root
          python3 -m gdmltp validate run_out/output.root
          root -l -b -q '.github/scripts/check_ttree.C("run_out/output.root", 5)' \
            > g4_root_check.log 2>&1 || { cat g4_root_check.log; exit 1; }
          grep -q "holds a classic TTree" g4_root_check.log
          python3 -m gdmltp analyze run_out/output.root -o run_out/analysis
          test -f run_out/analysis/summary.txt
          # Twiss phase-space beam end to end (host samples -> beam.dat -> /gun/beamFile)
          python3 -m gdmltp run --config examples/twiss_muon.yaml --local -n 20 -o twiss_out
          test -f twiss_out/beam.dat
          test -f twiss_out/output.root
          python3 -m gdmltp validate twiss_out/output.root
          echo "Geant4 YAML + Twiss integration OK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable
          path: build/g4sim
          retention-days: 1

  # ---- Publish the Geant4 image (gated on both test jobs) ----------------- #
  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, python-tests]
    permissions:
      contents: read
      packages: write
    outputs:
      # the exact tag the docker-run tests below (and the GENIE workflow's
      # transport stage) must pull -- not a re-derived guess at it
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the Geant4 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/geant4.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the pushed tag for the downstream test jobs
        id: image
        run: |
          echo "ref=$(head -n1 <<< '${{ steps.meta.outputs.tags }}')" >> "$GITHUB_OUTPUT"

  # ---- Docker-based run test: the README one-liner against the image we just
  #      published, pure Geant4 (no generator) ------------------------------- #
  #
  # The jobs above test the freshly BUILT engine (g4sim from this checkout) --
  # this one tests the shipped IMAGE the way a user meets it in the README:
  # `docker run <image> run --config <yaml>`, then validate/analyze, then plots
  # read straight off the ntuple. Plots + reports are kept as artifacts.
  docker-run-geant4:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: read
    env:
      GEANT4: ${{ needs.docker.outputs.image }}
      EVENTS: 200                 # CI-scale; the example YAML asks for 500
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate, validate and analyze -- exactly the README commands
        run: |
          set -euxo pipefail
          # the README's wrapper: mount the repo, run as this user so the
          # outputs are not root-owned
          gtp() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
                             -v "$PWD:/run" -w /run "$@"; }
          gtp "$GEANT4" run --config examples/water_proton.yaml -n "$EVENTS" -o g4_out
          test -f g4_out/output.root
          gtp "$GEANT4" validate g4_out/output.root
          gtp "$GEANT4" analyze g4_out/output.root -o g4_out/analysis
          test -f g4_out/analysis/summary.txt

      - name: Plot the output ntuple (independent uproot read, inside the image)
        run: |
          set -euxo pipefail
          # every requested event must be in the file, and each must carry a
          # transport record -- an image that runs but writes nothing is red here
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/run" -w /run --entrypoint python3 "$GEANT4" \
            .github/scripts/ci_ntuple_plots.py g4_out/output.root \
            -o g4_out/plots --label "150 MeV p -> water" \
            --min-events "$EVENTS" --require-steps

      - name: Upload the plots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-geant4-plots
          path: |
            g4_out/plots/
            g4_out/analysis/
          if-no-files-found: warn
          retention-days: 14
