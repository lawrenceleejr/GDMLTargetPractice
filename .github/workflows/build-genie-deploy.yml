name: Build GENIE Image
# Separate workflow: the GENIE image is heavy and its base/tunes/splines are
# version-sensitive, so it builds on its own and is not a required check for
# merges (the Python + Geant4 jobs in build-test-deploy.yml are). It runs on
# every push -- the image ships gdmltp, the driver, and the entrypoint, all of
# which change often -- and failures are REAL failures, shown red.
#
# The image is built ON TOP of the project's Geant4 image (one image runs
# GENIE + Geant4 end to end). The Geant4 base tag may lag this push by one
# build -- both workflows fire on the same commit -- but the Dockerfile rebuilds
# g4sim and gdmltp from THIS checkout, so only the heavy Geant4/ROOT/HepMC3
# layers come from the base and the app layer is always current.
on:
  push:
  workflow_dispatch:
    inputs:
      genie_base:
        description: "GENIE base image (the from-source GENIE stack)"
        required: false
        default: "ghcr.io/lawrenceleejr/gdmltargetpractice-genie-base:latest"
      geant4_base:
        description: "Geant4 image to layer GENIE onto"
        required: false
        default: "ghcr.io/lawrenceleejr/gdmltargetpractice:main"

env:
  # Base-image resolution: workflow_dispatch input > repo variable > default.
  # GENIE_BASE is our own from-source GENIE stack (built by
  # build-generator-bases.yml so nobody downstream compiles GENIE themselves);
  # GEANT4_BASE is the project's own Geant4 image, released tag.
  GENIE_BASE: ${{ github.event.inputs.genie_base || vars.GENIE_BASE_IMAGE || 'ghcr.io/lawrenceleejr/gdmltargetpractice-genie-base:latest' }}
  GEANT4_BASE: ${{ github.event.inputs.geant4_base || vars.GEANT4_BASE_IMAGE || 'ghcr.io/lawrenceleejr/gdmltargetpractice:main' }}
  # Temporarily point to the branch-specific base image for this PR
  # GENIE_BASE: ghcr.io/lawrenceleejr/gdmltargetpractice-genie-base:${{ env.SANITIZED_REF }}
  # GEANT4_BASE: ${{ github.event.inputs.geant4_base || vars.GEANT4_BASE_IMAGE || 'ghcr.io/lawrenceleejr/gdmltargetpractice:main' }}

jobs:
  docker-genie:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # the exact tag the docker-run test below pulls
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-genie
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR) the GENIE image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/genie.Dockerfile
          build-args: |
            GENIE_BASE=${{ env.GENIE_BASE }}
            GEANT4_BASE=${{ env.GEANT4_BASE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -x
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          mkdir -p run && cp gdml/liquid_argon_1m3.gdml run/
          # the image must expose gdmltp + the converter (a full generation
          # smoke lands once the base image + baked splines are pinned)
          docker run --rm -v "$PWD/run":/run -w /run --entrypoint python3 "$IMG" \
            -c "from gdmltp.backends import genie_convert; import gdmltp; print('genie image OK', gdmltp.__version__)"
          # the GENIE toolchain must be reachable through its shims and fully
          # linked under ITS env -- "image builds but gevgen can't run" must be
          # red here, not at a user
          docker run --rm --entrypoint bash "$IMG" -c \
            'set -e; for b in gevgen gevgen_fnal gntpc gmkspl; do command -v "$b"; done; source /opt/genie-env.sh; ! ldd "$GENIE/bin/gevgen" | grep "not found"'
          # ... and this image also carries the TRANSPORT engine: one image,
          # both stages. g4sim must be present and linked against the base ROOT
          # (i.e. WITHOUT the GENIE env) or the merge is broken.
          docker run --rm --entrypoint bash "$IMG" -c \
            'set -e; test -x /app/build/g4sim; ! ldd /app/build/g4sim | grep "not found"'

      - name: Publish the pushed tag for the downstream test job
        id: image
        run: |
          echo "ref=$(head -n1 <<< '${{ steps.meta.outputs.tags }}')" >> "$GITHUB_OUTPUT"

  # ---- Docker-based run test: GENIE vertex + Geant4 transport -------------- #
  #
  # The pipeline from the README/docs (docs/neutrino.md, step 4), tested BOTH
  # ways it can run now that the GENIE image carries the Geant4 engine:
  #   * the pure-Python front-end chaining containers from the host, and
  #   * the headline one-command bare `docker run` of the genie image alone,
  # plus the split --stage generator / transport flow. Every product must carry
  # the GENIE interaction record AND the Geant4 transport record.
  #
  # The standalone Geant4 image used for the front-end chain's transport stage
  # is this branch's build when that workflow has already published it, else the
  # released :main -- a mismatched pair is exactly what we want to catch.
  docker-run-genie-geant4:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker-genie]
    # the first run on a new probe/target computes cross-section splines with
    # gmkspl (cached below, so later runs skip it)
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    env:
      CONFIG: .github/ci/nu_water_transport.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the gdmltp front-end (it chains the two images)
        # pure Python -- no ROOT/Geant4/GENIE on the runner; the engines run in
        # the containers, exactly as on a user's laptop
        run: pip install -e .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image pair
        id: images
        run: |
          set -euxo pipefail
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          GEANT4="ghcr.io/$REPO:$BRANCH_TAG"
          if ! docker pull -q "$GEANT4"; then
            GEANT4="ghcr.io/$REPO:main"      # this branch's build is not up yet
            docker pull -q "$GEANT4"
          fi
          echo "genie=${{ needs.docker-genie.outputs.image }}" >> "$GITHUB_OUTPUT"
          echo "geant4=$GEANT4" >> "$GITHUB_OUTPUT"

      - name: Restore the cross-section splines
        id: xsec
        uses: actions/cache/restore@v4
        with:
          path: xsec_cache
          key: genie-xsec-${{ hashFiles('.github/ci/nu_water_transport.yaml') }}
          # a changed config still restores the old splines: their filename
          # encodes probe/target/tune/energy, so a non-matching one is ignored
          restore-keys: genie-xsec-

      - name: Generate with GENIE, transport with Geant4 (two images, one command)
        env:
          # --image only sets the FIRST stage; these pin every stage, so the
          # transport runs in the image resolved above rather than the default
          GDMLTP_IMAGE_GENIE: ${{ steps.images.outputs.genie }}
          GDMLTP_IMAGE_GEANT4: ${{ steps.images.outputs.geant4 }}
        run: |
          set -euxo pipefail
          mkdir -p nu_out xsec_cache
          # gmkspl caches its splines in the run directory: seed it from the
          # GitHub cache so only the first run on a probe/target pays for them
          cp xsec_cache/gxspl_*.xml nu_out/ 2>/dev/null || true
          gdmltp run --config "$CONFIG" -o nu_out
          test -f nu_out/output_0.root

      - name: Collect the computed splines
        if: always()
        run: |
          mkdir -p xsec_cache
          cp nu_out/gxspl_*.xml xsec_cache/ 2>/dev/null || true
          ls -la xsec_cache/ || true

      - name: Save the splines for the next run
        # restore/save rather than actions/cache: its save step is success-only,
        # and a gmkspl result is worth keeping even when the run failed after it
        # (that is the expensive part, and it is independent of what broke)
        if: always() && steps.xsec.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: xsec_cache
          key: genie-xsec-${{ hashFiles('.github/ci/nu_water_transport.yaml') }}

      - name: ONE image, ONE command -- GENIE + Geant4 in a single container
        # The headline the merged image exists for: a bare `docker run` of the
        # genie image completes BOTH stages -- gevgen under the GENIE env, then
        # g4sim under the base env -- and writes the finished output_0.root. No
        # front-end, no second container. Splines are already in the run dir.
        env:
          GENIE: ${{ steps.images.outputs.genie }}
        run: |
          set -euxo pipefail
          gtp() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
                             -v "$PWD:/run" -w /run "$@"; }
          mkdir -p bare_out
          cp nu_out/gxspl_*.xml bare_out/ 2>/dev/null || true
          gtp "$GENIE" run --config "$CONFIG" -o bare_out
          test -f bare_out/output_0.root
          # the intermediate products stay inspectable in the run dir
          test -f bare_out/events.hepmc
          test -f bare_out/vertex_level.root

      - name: Split flow still works (--stage generator, then transport)
        # The two-step recipe remains supported -- it is how a run is resumed,
        # and the only bare-docker path for backends whose images do not carry
        # Geant4 (achilles, pythia). Both stages run in the genie image here.
        env:
          GENIE: ${{ steps.images.outputs.genie }}
        run: |
          set -euxo pipefail
          gtp() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
                             -v "$PWD:/run" -w /run "$@"; }
          rm -rf split_out && mkdir -p split_out
          cp nu_out/gxspl_*.xml split_out/ 2>/dev/null || true
          gtp "$GENIE" run --config "$CONFIG" -o split_out --stage generator
          test -f split_out/events.hepmc
          test -f split_out/gdmltp_transport.json
          test ! -f split_out/output_0.root
          gtp "$GENIE" transport -o split_out
          test -f split_out/output_0.root

      - name: The merged ntuple must open in REAL ROOT as a TTree
        # exactly what a user does after downloading output_0.root; the Geant4
        # image ships ROOT, so this runs the genuine reader
        env:
          GEANT4: ${{ steps.images.outputs.geant4 }}
        run: |
          set -euxo pipefail
          EVENTS=$(python3 -c "import yaml; print(yaml.safe_load(open('$CONFIG'))['run']['events'])")
          for out in nu_out bare_out; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/run" -w /run --entrypoint root "$GEANT4" \
              -l -b -q ".github/scripts/check_ttree.C(\"$out/output_0.root\", $EVENTS)" \
              | tee "root_$out.log"
            grep -q "holds a classic TTree" "root_$out.log"
            if grep -q "Unknown class" "root_$out.log"; then
              echo "$out/output_0.root has a class ROOT cannot read" >&2; exit 1
            fi
          done

      - name: Validate and analyze the merged ntuple (README commands)
        env:
          GEANT4: ${{ steps.images.outputs.geant4 }}
        run: |
          set -euxo pipefail
          gtp() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
                             -v "$PWD:/run" -w /run "$@"; }
          gtp "$GEANT4" validate nu_out/output_0.root
          gtp "$GEANT4" analyze nu_out/output_0.root -o nu_out/analysis
          test -f nu_out/analysis/summary.txt

      - name: Plot the output ntuple (independent uproot read, inside the image)
        env:
          GEANT4: ${{ steps.images.outputs.geant4 }}
        run: |
          set -euxo pipefail
          # --require-nu AND --require-steps together are the hand-off itself:
          # the generator's interaction record on top of Geant4's transport
          # the event count comes from the config, so editing it there cannot
          # leave a stale expectation here
          EVENTS=$(python3 -c "import yaml; print(yaml.safe_load(open('$CONFIG'))['run']['events'])")
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/run" -w /run --entrypoint python3 "$GEANT4" \
            .github/scripts/ci_ntuple_plots.py nu_out/output_0.root \
            -o nu_out/plots --label "2 GeV numu -> water" \
            --min-events "$EVENTS" --require-steps --require-nu
          # the bare-docker product must carry the same two records
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/run" -w /run --entrypoint python3 "$GEANT4" \
            .github/scripts/ci_ntuple_plots.py bare_out/output_0.root \
            -o bare_out/plots --label "2 GeV numu -> water (bare docker)" \
            --min-events "$EVENTS" --require-steps --require-nu

      - name: Upload the plots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-genie-geant4-plots
          path: |
            nu_out/plots/
            nu_out/analysis/
            bare_out/plots/
          if-no-files-found: warn
          retention-days: 14
