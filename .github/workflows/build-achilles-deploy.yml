name: Build Achilles Image
# Separate workflow (mirrors the GENIE one): the Achilles base and its run-card
# grammar are release-sensitive, so it builds independently and is not a
# required merge check (the Python + Geant4 jobs in build-test-deploy.yml are).
# Runs on every push; failures are REAL failures, shown red.
on:
  push:
  workflow_dispatch:
    inputs:
      achilles_base:
        description: "Achilles base image"
        required: false
        default: "ghcr.io/lawrenceleejr/gdmltargetpractice-achilles-base:latest"

env:
  # Base-image resolution: workflow_dispatch input > repo variable > our own
  # from-source base (built by build-generator-bases.yml so nobody downstream
  # compiles Achilles themselves). Red until that base workflow has published once.
  ACHILLES_BASE: ${{ github.event.inputs.achilles_base || vars.ACHILLES_BASE_IMAGE || 'ghcr.io/lawrenceleejr/gdmltargetpractice-achilles-base:latest' }}

jobs:
  docker-achilles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-achilles
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR) the Achilles image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/achilles.Dockerfile
          build-args: |
            ACHILLES_BASE=${{ env.ACHILLES_BASE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -x
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          mkdir -p run && cp gdml/liquid_argon_1m3.gdml run/
          # the image must expose gdmltp + the converter (a full generation
          # smoke lands once the base image + run-card template are pinned)
          docker run --rm -v "$PWD/run":/run -w /run --entrypoint python3 "$IMG" \
            -c "from gdmltp.backends import achilles_convert; import gdmltp; print('achilles image OK', gdmltp.__version__)"
          # the generator binary itself must be on PATH and fully linked
          docker run --rm --entrypoint bash "$IMG" -c \
            'set -e; command -v achilles; ! ldd "$(command -v achilles)" | grep "not found"'
